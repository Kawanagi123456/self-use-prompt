<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: { sans: ['"SF Pro Display"', '"SF Pro"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'] },
            animation: {
                'fade-in': 'fadeIn 0.3s ease-out',
                'slide-up': 'slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1)',
                'shimmer': 'shimmer 2.5s ease-in-out infinite',
            },
            keyframes: {
                fadeIn: { '0%': { opacity: '0', transform: 'translateY(6px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                slideUp: { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
            }
        }
    }
}
</script>
<style>
:root {
    --blur-intensity: 20px;
    --glass-bg: rgba(18, 18, 20, 0.38);
    --glass-bg-hover: rgba(28, 28, 32, 0.48);
    --glass-bg-active: rgba(40, 40, 48, 0.55);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-hover: rgba(255, 255, 255, 0.18);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --shimmer-speed: 2.5s;
}

*, *::before, *::after { box-sizing: border-box; }
body {
    font-family: '"SF Pro Display"', '"SF Pro"', -apple-system, BlinkMacSystemFont, '"Segoe UI"', sans-serif;
    background: #06080d;
    color: #e4e4e7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    height: 100vh;
}

/* ========== WebGL Shader Background Canvas (replaces old particle system) ========== */
#shaderCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
}

/* ========== Vignette Overlay (above shader, below UI) ========== */
#vignetteOverlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4, 6, 12, 0.55) 85%, rgba(2, 3, 6, 0.8) 100%);
}

/* ========== Glassmorphism ========== */
.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur-intensity));
    -webkit-backdrop-filter: blur(var(--blur-intensity));
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
}
.glass-hover:hover {
    background: var(--glass-bg-hover);
    border-color: var(--glass-border-hover);
}
.glass-active {
    background: var(--glass-bg-active);
    border-color: rgba(255, 255, 255, 0.12);
}

/* ========== Shimmer Effect ========== */
.shimmer-enabled .shimmer-card {
    position: relative;
    overflow: hidden;
}
.shimmer-enabled .shimmer-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.025) 45%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.025) 55%, transparent 65%);
    background-size: 200% 100%;
    animation: shimmer var(--shimmer-speed) ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
}
.shimmer-enabled .shimmer-card:hover::after {
    animation-duration: 1.2s;
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

/* ========== Sidebar active indicator ========== */
.sidebar-item {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 2px solid transparent;
}
.sidebar-item.active {
    border-left-color: var(--accent);
    background: rgba(99, 102, 241, 0.08);
}
.sidebar-item:hover:not(.active) {
    background: rgba(255, 255, 255, 0.03);
}

/* ========== Sidebar: per-category "expand / collapse all subclasses" toggle ========== */
.lib-expand-btn {
    opacity: 0.3;
    transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.sidebar-item:hover .lib-expand-btn { opacity: 0.75; }
.sidebar-item.active .lib-expand-btn { opacity: 1; }
.lib-expand-btn:hover { background: rgba(255, 255, 255, 0.08); }

/* ========== Tag library: collapsible 子类 (subclass) blocks ========== */
.lib-seg.is-collapsed > .lib-seg-body { display: none; }
.lib-seg-chevron { display: inline-block; transition: transform 0.2s ease; }
.lib-seg.is-collapsed .lib-seg-chevron { transform: rotate(-90deg); }
.lib-seg.is-collapsed > .lib-seg-head { margin-bottom: 0; }

/* ========== Selected-chip hover preview ========== */
@keyframes chipPreviewIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}
#chipPreview {
    position: fixed;
    z-index: 260;
    width: 260px;
    pointer-events: auto;
    animation: chipPreviewIn 0.16s ease-out;
}

/* ========== Card transitions ========== */
.tag-card {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    user-select: none;
}
.tag-card:hover { transform: translateY(-2px); }
.tag-card:active { transform: scale(0.96); }

.char-card-music {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    user-select: none;
}
.char-card-music:hover { transform: translateY(-4px); }
.char-card-music:active { transform: scale(0.97); }

/* ========== Selected chip ========== */
.selected-chip-v10 {
    animation: fadeIn 0.25s ease-out;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.selected-chip-v10:hover { transform: translateY(-1px); }

/* ========== Copy pulse ========== */
@keyframes copyPulseV10 {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
    50% { box-shadow: 0 0 0 16px rgba(99, 102, 241, 0); }
}
.copy-pulse-v10 { animation: copyPulseV10 0.7s ease-out; }

/* ========== Range slider styling ========== */
input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #6366f1;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
}

/* ========== Settings Modal ========== */
.settings-modal {
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

/* ========== Section title ========== */
.section-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #e4e4e7;
}
</style>
</head>

<!-- ==================== JavaScript ==================== -->
<script>
(function() {
    'use strict';

    // ================================================================
    // CHANGE 1: WebGL Shader Background (replaces old 2D particle system)
    //   - Full-screen WebGL canvas with noise-based rotation + sine wave
    //   - warping + layered color mixing (yellow/blue + red/blue).
    //   - Properly resizes with window, runs in rAF loop, pointer-events disabled.
    // ================================================================

    var shaderCanvas = document.getElementById('shaderCanvas');
    var gl = shaderCanvas.getContext('webgl') || shaderCanvas.getContext('experimental-webgl');

    if (gl) {
        var vertexShaderSource = [
            'attribute vec2 a_position;',
            'void main() {',
            '  gl_Position = vec4(a_position, 0.0, 1.0);',
            '}'
        ].join('\n');

        var fragmentShaderSource = [
            'precision mediump float;',
            '#define S(a,b,t) smoothstep(a,b,t)',
            'mat2 Rot(float a) {',
            '  float s = sin(a);',
            '  float c = cos(a);',
            '  return mat2(c, -s, s, c);',
            '}',
            'vec2 hash(vec2 p) {',
            '  p = vec2(dot(p,vec2(2127.1,81.17)), dot(p,vec2(1269.5,283.37)));',
            '  return fract(sin(p)*43758.5453);',
            '}',
            'float noise(in vec2 p) {',
            '  vec2 i = floor(p);',
            '  vec2 f = fract(p);',
            '  vec2 u = f*f*(3.0-2.0*f);',
            '  float n = mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)), f-vec2(0.0,0.0)),',
            '                     dot(-1.0+2.0*hash(i+vec2(1.0,0.0)), f-vec2(1.0,0.0)), u.x),',
            '               mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)), f-vec2(0.0,1.0)),',
            '                     dot(-1.0+2.0*hash(i+vec2(1.0,1.0)), f-vec2(1.0,1.0)), u.x), u.y);',
            '  return 0.5 + 0.5*n;',
            '}',
            'uniform vec2 u_resolution;',
            'uniform float u_time;',
            'void mainImage(out vec4 fragColor, in vec2 fragCoord) {',
            '  vec2 uv = fragCoord/u_resolution.xy;',
            '  float ratio = u_resolution.x / u_resolution.y;',
            '  vec2 tuv = uv;',
            '  tuv -= .5;',
            '  float degree = noise(vec2(u_time*.1, tuv.x*tuv.y));',
            '  tuv.y *= 1./ratio;',
            '  tuv *= Rot(radians((degree-.5)*720.+180.));',
            '  tuv.y *= ratio;',

    function getGroupData(cat, id) { return promptLibrary[cat].find(function(g) { return g.id === id; }); }

    function getAllSelectedGroups() {
        var result = [];
        for (var i = 0; i < ALL_ORDER.length; i++) {
            var cat = ALL_ORDER[i], ids = state.selectedGroups[cat];
            if (!ids) continue;
            var arr = Array.from(ids);
            for (var j = 0; j < arr.length; j++) {
                var group = getGroupData(cat, arr[j]);
                if (group) result.push({
                    category:cat, id:group.id, name:group.name, texts:group.texts, imageUrl:group.imageUrl,
                    desc:group.desc || '', sub:group.sub || '', model:group.model || '',
                    tag:group.tag || '', images:group.images || null
                });
            }
        }
        return result;
    }

    function getTotalGroups() {
        var n = 0, cats = Object.keys(state.selectedGroups);
        for (var i = 0; i < cats.length; i++) { n += state.selectedGroups[cats[i]].size; }
        return n;
    }

    function getTotalTexts() {
        var n = 0, all = getAllSelectedGroups();
        for (var i = 0; i < all.length; i++) { n += all[i].texts.length; }
        return n;
    }

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
        return a;
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
        return new Promise(function(resolve, reject) {
            var ta = document.createElement('textarea'); ta.value = text;
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
            document.body.appendChild(ta); ta.focus(); ta.select();
            try { var ok = document.execCommand('copy'); document.body.removeChild(ta); ok ? resolve() : reject(new Error('execCommand failed')); }
            catch(e) { document.body.removeChild(ta); reject(e); }
        });
    }

    // ==================== Persistence ====================
    function saveState() {
        var data = {
            selectedGroups:{}, expandedCategories:state.expandedCategories, activeCategory:state.activeCategory,
            nsfwEnabled:state.nsfwEnabled, blurIntensity:state.blurIntensity, shimmerEnabled:state.shimmerEnabled,
            mode:state.mode, lang:state.lang, libCollapsed:state.libCollapsed
        };
        var cats = Object.keys(state.selectedGroups);
        for (var i = 0; i < cats.length; i++) { data.selectedGroups[cats[i]] = Array.from(state.selectedGroups[cats[i]]); }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    function loadState() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                // Try loading from v11 storage as fallback
                raw = localStorage.getItem('sd-prompt-selector-final-v11');
                if (!raw) return;
            }
            var data = JSON.parse(raw);
            if (data.selectedGroups) {
                var cats = Object.keys(state.selectedGroups);
                for (var i = 0; i < cats.length; i++) { if (Array.isArray(data.selectedGroups[cats[i]])) state.selectedGroups[cats[i]] = new Set(data.selectedGroups[cats[i]]); }
            }
            if (data.expandedCategories) Object.assign(state.expandedCategories, data.expandedCategories);
            if (typeof data.activeCategory === 'string') state.activeCategory = data.activeCategory;
            if (typeof data.nsfwEnabled === 'boolean') state.nsfwEnabled = data.nsfwEnabled;
            if (typeof data.blurIntensity === 'number') state.blurIntensity = data.blurIntensity;
            if (typeof data.shimmerEnabled === 'boolean') state.shimmerEnabled = data.shimmerEnabled;
            if (data.mode === 'anima' || data.mode === 'sd') state.mode = data.mode;
            if (['zh-CN','zh-TW','en'].includes(data.lang)) state.lang = data.lang;
            if (data.libCollapsed && typeof data.libCollapsed === 'object') state.libCollapsed = data.libCollapsed;
        } catch(e) {}
    }

    function performSearch(term) {
        var order = state.nsfwEnabled ? ALL_ORDER : SAFE_ORDER;
        for (var i = 0; i < order.length; i++) {
            var cat = order[i];
            var section = document.querySelector('[data-cat-section="' + cat + '"]');
            var items = document.querySelectorAll('[data-cat-item="' + cat + '"]');
            var catHasResults = false;
            for (var j = 0; j < items.length; j++) {
                var searchText = (items[j].getAttribute('title') || '') + ' ' + (items[j].textContent || '');
                if (term === '' || searchText.toLowerCase().indexOf(term.toLowerCase()) !== -1) {
                    items[j].style.display = ''; catHasResults = true;
                } else {
                    items[j].style.display = 'none';
                }
            }
            var noResultEl = section ? section.querySelector('.search-no-results-v10') : null;
            if (!catHasResults && term !== '') {
                if (!noResultEl) {
                    noResultEl = document.createElement('div'); noResultEl.className = 'search-no-results-v10 text-center py-6 text-zinc-500 text-sm';
                    noResultEl.textContent = t('search_noResults');
                    if (section) section.appendChild(noResultEl);
                }
                noResultEl.style.display = '';
            } else if (noResultEl) { noResultEl.style.display = 'none'; }
        }
        // Hide whole 子类 blocks whose cards are all filtered out.
        // While searching, matching blocks are force-expanded so hits are never hidden
        // inside a collapsed 子类; clearing the search restores the saved collapse state.
        var libSegs = document.querySelectorAll('[data-lib-seg]');
        for (var s = 0; s < libSegs.length; s++) {
            var segItems = libSegs[s].querySelectorAll('[data-cat-item]'), segVisible = false;
            for (var s2 = 0; s2 < segItems.length; s2++) {
                if (segItems[s2].style.display !== 'none') { segVisible = true; break; }
            }
            libSegs[s].style.display = (term !== '' && segVisible === false && segItems.length > 0) ? 'none' : '';
            if (term !== '' && segVisible) libSegs[s].classList.remove('is-collapsed');
        }
        if (term === '') applyLibSegCollapse();
        if (term !== '') { dom.searchClearBtn.classList.remove('hidden'); }
        else {
            dom.searchClearBtn.classList.add('hidden');
            var allNoResults = document.querySelectorAll('.search-no-results-v10');
            for (var k = 0; k < allNoResults.length; k++) { allNoResults[k].style.display = 'none'; }
        }
    }

    function handleSearchInput(e) {
        var term = e.target.value.trim();
        if (searchTimeout) clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function() { performSearch(term); }, 150);
    }

    function clearSearch() {
        dom.searchInput.value = ''; performSearch(''); dom.searchClearBtn.classList.add('hidden'); dom.searchInput.focus();
    }

    // ==================== Render: Sidebar ====================
    function renderSidebar() {
        var order = state.nsfwEnabled ? ALL_ORDER : SAFE_ORDER;
        var html = '';
        for (var i = 0; i < order.length; i++) {
            var cat = order[i], meta = categoryMeta[cat];
            var selCount = state.selectedGroups[cat] ? state.selectedGroups[cat].size : 0;
            var isActive = state.activeCategory === cat;
            // Only tag-library categories split into several 子类 get the expand-all toggle
            var segKeys = libSegKeys(cat);
            var canExpand = !!meta.image && segKeys.length > 1;
            var allExp = canExpand ? libAllExpanded(segKeys) : true;
            html += '<div class="sidebar-item w-full flex items-center rounded-r-xl' + (isActive ? ' active' : '') + '">' +
                '<button class="flex-1 min-w-0 flex items-center gap-3 px-4 py-2.5 text-left text-sm font-medium transition-all duration-200 ' +
                (isActive ? 'text-zinc-100' : 'text-zinc-400') + '" data-sidebar-cat="' + cat + '">' +
                '<span class="text-base w-6 text-center">' + meta.icon + '</span>' +
                '<span class="flex-1 truncate">' + t('cat_' + cat) + '</span>' +
                (selCount > 0 ? '<span class="sidebar-badge-v10 text-[11px] ' + (isActive ? 'text-zinc-400' : 'text-zinc-600') + ' bg-white/5 px-1.5 py-0.5 rounded-full min-w-[20px] text-center">' + selCount + '</span>' : '') +
                '</button>' +
                (canExpand
                    ? '<button class="lib-expand-btn mr-1.5 flex-shrink-0 w-6 h-6 rounded-lg flex items-center justify-center text-[11px] text-zinc-400 hover:text-zinc-100" ' +
                      'data-expand-cat="' + cat + '" title="' + (allExp ? '收起全部子类' : '展开全部子类') + '" aria-label="expand all subclasses">' + (allExp ? '▾' : '▸') + '</button>'
                    : '') +
                '</div>';
        }
        dom.sidebarNav.innerHTML = html;

        // Bind sidebar click events
        var items = dom.sidebarNav.querySelectorAll('[data-sidebar-cat]');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                var cat = this.dataset.sidebarCat;
                if (cat) {
                    // Only the active highlight changes here, so a full (expensive)
                    // refreshUI()/renderMainContent() re-render is not needed.
                    state.activeCategory = cat;
                    scrollToCategory(cat);
                    renderSidebar();
                    saveState();
                }
            });
        });

        // "Expand / collapse every 子类 of this category" toggles
        var expandBtns = dom.sidebarNav.querySelectorAll('[data-expand-cat]');
        expandBtns.forEach(function(btn) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var cat = this.dataset.expandCat;
                if (!cat) return;
                var keys = libSegKeys(cat), expand = !libAllExpanded(keys);
                for (var k = 0; k < keys.length; k++) {
                    if (expand) delete state.libCollapsed[keys[k]];
                    else state.libCollapsed[keys[k]] = true;
                }
                state.activeCategory = cat;
                applyLibSegCollapse(cat);
                renderSidebar();
                scrollToCategory(cat);
                saveState();
            });
        });
    }

    function scrollToCategory(cat) {
        var section = document.querySelector('[data-cat-section="' + cat + '"]');
        if (section) { section.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }

                            (selL ? '<div class="lib-checkmark-v10 absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-' + meta.color + '-500 flex items-center justify-center text-white text-xs font-bold shadow-lg z-20">✓</div>' : '') +
                            (gl.images ? '<button class="absolute top-2 left-2 z-20 px-2 py-0.5 rounded-full bg-black/60 text-[10px] text-zinc-100 hover:bg-black/90 backdrop-blur-sm border border-white/10" data-gallery="1" title="查看全部 ' + gl.images.length + ' 张示例图">🖼 ' + gl.images.length + '</button>' : '') +
                            '<div class="absolute inset-0 bg-gradient-to-t from-zinc-950/90 via-zinc-950/15 to-transparent pointer-events-none"></div>' +

                    html += '</div></div>';
                }
            } else if (isCharacter) {
                html += '<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">';
                for (var j = 0; j < groups.length; j++) {

                    var gName = getGroupName(g), imgUrl = g.imageUrl || '';
                    html += '<div class="char-card-music group shimmer-card relative rounded-2xl overflow-hidden glass border-white/5 ' +
                        (isSel ? 'ring-2 ring-' + meta.color + '-500/50 shadow-lg shadow-' + meta.color + '-500/15' : '') + '"' +
                        ' data-cat-item="' + cat + '" data-cat="' + cat + '" data-id="' + g.id + '" title="' + gName + ': ' + g.texts.join(', ') + '">' +
                        '<div class="aspect-[3/2.5] bg-gradient-to-br from-zinc-800 to-zinc-900 relative overflow-hidden">' +

                        (isSel ? '<div class="checkmark-overlay-v10 absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-' + meta.color + '-500 flex items-center justify-center text-white text-xs font-bold shadow-lg z-10">✓</div>' : '') +

                html += '</div>';
            } else {
                html += '<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">';
                for (var jj = 0; jj < groups.length; jj++) {
                    var gg = groups[jj], isSel2 = state.selectedGroups[cat] && state.selectedGroups[cat].has(gg.id);
                    var color = meta.color, cls2 = isSel2 ? tagSelectedCls[color] : tagUnselectedCls[color];
                    var gName2 = getGroupName(gg);
                    var tip2 = meta.dir ? libTitle(gg, gName2) : gg.texts.join(', ');
                    html += '<button class="tag-card shimmer-card px-4 py-4 rounded-2xl text-sm font-semibold border ' + cls2 + ' flex flex-col items-center justify-center text-center leading-snug min-h-[72px]"' +
                        ' data-cat-item="' + cat + '" data-cat="' + cat + '" data-id="' + gg.id + '" title="' + esc(tip2) + '">' +
                        '<span>' + esc(gName2) + '</span>' +
                        (meta.dir && gg.desc ? '<span class="text-[10px] font-normal opacity-45 mt-1 leading-tight">' + esc(gg.desc.slice(0, 34)) + (gg.desc.length > 34 ? '…' : '') + '</span>' : '') +

            html += '</section>';

        dom.contentSections.innerHTML = html;

        // Bind click events — each card calls toggleGroup which now uses targeted updates
        var allItems = dom.contentSections.querySelectorAll('[data-cat]');
        allItems.forEach(function(el) {
            el.addEventListener('click', function(e) {
                var cat = this.dataset.cat, id = parseInt(this.dataset.id, 10);
                if (e.target && e.target.closest && e.target.closest('[data-gallery]')) { openGallery(cat, id); return; }

    // ==================== Image Gallery (tags with several example images) ====================
    var galleryEl = null;

    function ensureGallery() {
        if (galleryEl) return galleryEl;
        galleryEl = document.createElement('div');
        galleryEl.id = 'tagGallery';
        galleryEl.className = 'fixed inset-0 z-[300] hidden items-center justify-center bg-black/85 backdrop-blur-md p-4';
        galleryEl.innerHTML =
            '<div class="glass rounded-3xl max-w-6xl w-full max-h-[88vh] flex flex-col overflow-hidden border-white/10">' +
            '<div class="flex items-center justify-between gap-4 px-5 py-3 border-b border-white/10 flex-shrink-0">' +
            '<div class="min-w-0"><p id="tagGalleryTitle" class="text-sm font-bold text-zinc-100 truncate"></p>' +
            '<p id="tagGallerySub" class="text-[11px] text-zinc-500 mt-0.5 font-mono truncate"></p></div>' +
            '<button id="tagGalleryClose" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 text-sm flex-shrink-0">✕</button>' +
            '</div>' +
            '<div id="tagGalleryBody" class="overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>' +
            '</div>';
        document.body.appendChild(galleryEl);
        galleryEl.addEventListener('click', function(e) { if (e.target === galleryEl) closeGallery(); });
        galleryEl.querySelector('#tagGalleryClose').addEventListener('click', closeGallery);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeGallery(); });
        return galleryEl;
    }

    function openGallery(cat, id) {
        var g = getGroupData(cat, id);
        if (!g || !g.images || !g.images.length) return;
        var el = ensureGallery();
        el.querySelector('#tagGalleryTitle').textContent = getGroupName(g);
        el.querySelector('#tagGallerySub').textContent = (g.tag || '') + ' · ' + g.images.length + ' 张示例图 · ' + (g.desc || '');
        var html = '';
        for (var i = 0; i < g.images.length; i++) {
            html += '<a href="' + g.images[i] + '" target="_blank" rel="noopener" class="relative rounded-2xl overflow-hidden glass border-white/5 aspect-[3/4] block">' +
                '<img src="' + g.images[i] + '" loading="lazy" decoding="async" class="w-full h-full object-cover">' +
                '<span class="absolute bottom-1.5 right-1.5 text-[10px] px-1.5 py-0.5 rounded-full bg-black/65 text-zinc-300">' + (i + 1) + '</span></a>';
        }
        el.querySelector('#tagGalleryBody').innerHTML = html;
        el.classList.remove('hidden'); el.classList.add('flex');
    }

    function closeGallery() {
        if (galleryEl) { galleryEl.classList.add('hidden'); galleryEl.classList.remove('flex'); }
    }

    // ==================== Tag library: 子类 (subclass) collapse state ====================
    // A segment is identified by "category||subclass" so its collapsed state survives re-renders.

    function libSegKeys(cat) {
        var groups = promptLibrary[cat] || [], seen = {}, keys = [];
        for (var i = 0; i < groups.length; i++) {
            var s = groups[i].sub || '';
            if (!seen[s]) { seen[s] = 1; keys.push(cat + '||' + s); }
        }
        return keys;
    }

    function libAllExpanded(keys) {
        for (var i = 0; i < keys.length; i++) { if (state.libCollapsed[keys[i]]) return false; }
        return true;
    }

    // Re-apply collapsed state to the rendered segments (all, or just one category)
    function applyLibSegCollapse(cat) {
        var segs = document.querySelectorAll('.lib-seg');
        for (var i = 0; i < segs.length; i++) {
            if (cat && segs[i].dataset.libSeg !== cat) continue;
            if (state.libCollapsed[segs[i].dataset.segKey]) segs[i].classList.add('is-collapsed');
            else segs[i].classList.remove('is-collapsed');
        }
    }

    function toggleLibSeg(key) {
        if (!key) return;
        if (state.libCollapsed[key]) delete state.libCollapsed[key];
        else state.libCollapsed[key] = true;
        applyLibSegCollapse();
        syncLibExpandButtons();
        saveState();
    }

    // Keep the sidebar glyphs in sync with the current collapse state
    function syncLibExpandButtons() {
        var btns = dom.sidebarNav.querySelectorAll('[data-expand-cat]');
        btns.forEach(function(btn) {
            var allExp = libAllExpanded(libSegKeys(btn.dataset.expandCat));
            btn.textContent = allExp ? '▾' : '▸';
            btn.title = allExp ? '收起全部子类' : '展开全部子类';
        });
    }

    // ==================== Selected-chip hover preview ====================
    var chipPreviewEl = null, chipPreviewShowTimer = null, chipPreviewHideTimer = null;

    function ensureChipPreview() {
        if (chipPreviewEl) return chipPreviewEl;
        chipPreviewEl = document.createElement('div');
        chipPreviewEl.id = 'chipPreview';
        chipPreviewEl.className = 'hidden';
        chipPreviewEl.addEventListener('mouseenter', function() {
            if (chipPreviewHideTimer) { clearTimeout(chipPreviewHideTimer); chipPreviewHideTimer = null; }
        });
        chipPreviewEl.addEventListener('mouseleave', scheduleChipPreviewHide);
        document.body.appendChild(chipPreviewEl);
        return chipPreviewEl;
    }

    function showChipPreview(chip) {
        var cat = chip.dataset.chipCat, id = parseInt(chip.dataset.chipId, 10);
        if (!cat || !id) return;
        var g = getGroupData(cat, id);
        if (!g) return;

        var el = ensureChipPreview();
        var name = getGroupName(g);
        var tagLine = g.tag || (g.texts || []).join(', ');
        var h = '<div class="glass rounded-2xl overflow-hidden border-white/10 shadow-2xl shadow-black/50">';

        if (g.imageUrl) {
            h += '<div class="relative aspect-[4/3] bg-zinc-900 overflow-hidden">' +
                 '<img src="' + g.imageUrl + '" alt="" class="w-full h-full object-cover">' +
                 '<div class="absolute inset-0 bg-gradient-to-t from-zinc-950/85 via-transparent to-transparent"></div>' +
                 '<p class="absolute bottom-2 left-3 right-3 text-sm font-bold text-zinc-100 truncate">' + esc(name) + '</p>' +
                 '</div>';
            h += '<div class="p-3 space-y-1.5">';
        } else {
            h += '<div class="p-3 space-y-1.5">' +
                 '<p class="text-sm font-bold text-zinc-100 truncate">' + esc(name) + '</p>';
        }

        if (tagLine) h += '<p class="text-[11px] font-mono text-indigo-300/90 leading-snug break-all">' + esc(tagLine) + '</p>';
        if (g.desc) h += '<p class="text-[11px] text-zinc-400 leading-relaxed">' + esc(g.desc) + '</p>';

        var extra = [];
        if (g.sub) extra.push('子类：' + g.sub);
        if (g.model) extra.push('模特：' + g.model);
        if (extra.length) h += '<p class="text-[10px] text-zinc-500 leading-snug">' + esc(extra.join(' · ')) + '</p>';
        if (g.images && g.images.length > 1) {
            h += '<p class="text-[10px] text-zinc-500">🖼 共 ' + g.images.length + ' 张示例图 · 点击查看</p>';
        }
        h += '</div></div>';

        el.innerHTML = h;
        el.classList.remove('hidden');

        // Position next to the chip, preferring the left (the panel hugs the right edge)
        var r = chip.getBoundingClientRect();
        var w = el.offsetWidth, hh = el.offsetHeight;
        var left = r.left - w - 10;
        if (left < 8) left = Math.min(window.innerWidth - w - 8, r.right + 10);
        var top = r.top;
        if (top + hh > window.innerHeight - 8) top = window.innerHeight - hh - 8;
        if (top < 8) top = 8;
        el.style.left = Math.max(8, left) + 'px';
        el.style.top = top + 'px';

        if (g.images && g.images.length > 1) {
            el.style.cursor = 'pointer';
            el.onclick = function() { hideChipPreview(); openGallery(cat, id); };
        } else {
            el.style.cursor = 'default';
            el.onclick = null;
        }
    }

    function scheduleChipPreviewHide() {
        if (chipPreviewHideTimer) clearTimeout(chipPreviewHideTimer);
        chipPreviewHideTimer = setTimeout(hideChipPreview, 180);
    }

    function hideChipPreview() {
        if (chipPreviewShowTimer) { clearTimeout(chipPreviewShowTimer); chipPreviewShowTimer = null; }
        if (chipPreviewHideTimer) { clearTimeout(chipPreviewHideTimer); chipPreviewHideTimer = null; }
        if (chipPreviewEl) { chipPreviewEl.classList.add('hidden'); chipPreviewEl.onclick = null; }
    }

    // ==================== Render: Right Panel ====================
    function renderSelectedGroups() {
        hideChipPreview();
        var all = getAllSelectedGroups(), total = all.length, totalTexts = getTotalTexts();
        dom.groupCountBadge.textContent = total + ' ' + t('badge_groups');
        dom.sidebarTotalBadge.textContent = total + ' 组已选';

        if (total === 0) {
            dom.clearAllBtn.classList.add('hidden'); dom.emptyHintRight.classList.remove('hidden');
            dom.selectedGroupsContainer.innerHTML = ''; dom.selectedGroupsContainer.appendChild(dom.emptyHintRight);
        } else {
            dom.clearAllBtn.classList.remove('hidden'); dom.emptyHintRight.classList.add('hidden');
            var html = '';
            for (var i = 0; i < all.length; i++) {
                var g = all[i], color = categoryMeta[g.category].color, cls = chipCls[color], gName = getGroupName(g);
                html += '<span class="selected-chip-v10 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold border ' + cls + '" data-chip-cat="' + g.category + '" data-chip-id="' + g.id + '">' + esc(gName) +
                    '<span class="text-[10px] font-normal opacity-50">(' + g.texts.length + ')</span>' +
                    '<button class="remove-chip-btn-v10 w-4 h-4 rounded-full flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 transition-colors text-zinc-500 flex-shrink-0 text-[10px]" data-cat="' + g.category + '" data-id="' + g.id + '" title="Remove">✕</button></span>';
            }
            dom.selectedGroupsContainer.innerHTML = html;
            dom.selectedGroupsContainer.appendChild(dom.emptyHintRight);
        }
    }

    function composePrompt(shuffleAll) {
        var allGroups = getAllSelectedGroups();
        if (allGroups.length === 0) return '';
        var allTexts = [];
        for (var i = 0; i < allGroups.length; i++) { allTexts = allTexts.concat(allGroups[i].texts); }
        if (shuffleAll) allTexts = shuffle(allTexts);
        var prompt = allTexts.join(', ');
        if (state.mode === 'anima') prompt = t('animaPrefix') + prompt;
        return prompt;
    }

    function renderPrompt(shuffleAll, forceOverwrite) {
        var prompt = composePrompt(!!shuffleAll);
        lastAutoPrompt = prompt;
        if (forceOverwrite || !promptIsCustom || dom.promptOutput.value.trim() === '') {
            dom.promptOutput.value = prompt;
            promptIsCustom = false;
        }
        dom.charCount.textContent = dom.promptOutput.value.length + ' ' + t('badge_chars');
        updateRegenBtn();
    }

    function updateRegenBtn() {
        if (!dom.regenPromptBtn) return;
        if (promptIsCustom && dom.promptOutput.value.trim() !== '') {
            dom.regenPromptBtn.classList.remove('hidden');
        } else {
            dom.regenPromptBtn.classList.add('hidden');
        }
    }

    // ================================================================
    // CHANGE 2: Selective / targeted DOM updates
    //   Instead of calling the heavy refreshUI() → renderMainContent()
    //   on every selection toggle, we now patch only the affected
    //   elements directly. Full re-renders are reserved for structural
    //   changes: initial load, NSFW toggle, language switch, search.
    // ================================================================

    /**
     * Update a single card's visual selection state in-place.
     * @param {string} cat - Category key (e.g. 'quality', 'character')
     * @param {number} id  - Group id within that category
     */
    function patchCardVisual(cat, id) {
        // Scoped to the main content on purpose: the right-panel chip remove buttons
        // also carry data-cat / data-id, so an unscoped query would be ambiguous.
        var card = document.querySelector('#contentSections [data-cat="' + cat + '"][data-id="' + id + '"]');
        if (!card) return;
        var isSel = state.selectedGroups[cat] && state.selectedGroups[cat].has(id);
        var meta = categoryMeta[cat];
        var color = meta.color;

        if (cat === 'character') {
            // Character cards: toggle ring + shadow + checkmark overlay
            if (isSel) {
                card.classList.add('ring-2', 'ring-purple-500/50', 'shadow-lg', 'shadow-purple-500/15');
                var inner = card.querySelector('div[class*="aspect-"]');
                if (inner && !inner.querySelector('.checkmark-overlay-v10')) {
                    var check = document.createElement('div');
                    check.className = 'checkmark-overlay-v10 absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-bold shadow-lg z-10';
                    check.textContent = '✓';
                    inner.appendChild(check);
                }
            } else {
                card.classList.remove('ring-2', 'ring-purple-500/50', 'shadow-lg', 'shadow-purple-500/15');
                var checkmark = card.querySelector('.checkmark-overlay-v10');
                if (checkmark) checkmark.remove();
            }
        } else if (meta.image) {
            // Tag-library cards: ring + shadow + checkmark overlay. This must mirror
            // the markup built by renderMainContent, otherwise deselecting (or
            // "clear all") would clear the state but leave the ✓ and ring on screen.
            var libRing = ['ring-2', 'ring-' + color + '-500/60', 'shadow-lg', 'shadow-' + color + '-500/15'];
            if (isSel) {
                for (var a = 0; a < libRing.length; a++) card.classList.add(libRing[a]);
                card.classList.remove('hover:border-white/15');
                var libInner = card.querySelector('div[class*="aspect-"]');
                if (libInner && !libInner.querySelector('.lib-checkmark-v10')) {
                    var libCheck = document.createElement('div');
                    libCheck.className = 'lib-checkmark-v10 absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-' + color + '-500 flex items-center justify-center text-white text-xs font-bold shadow-lg z-20';
                    libCheck.textContent = '✓';
                    libInner.appendChild(libCheck);
                }
            } else {
                for (var b = 0; b < libRing.length; b++) card.classList.remove(libRing[b]);
                card.classList.add('hover:border-white/15');
                var libOld = card.querySelector('.lib-checkmark-v10');
                if (libOld) libOld.remove();
            }
        } else {
            // Tag cards: swap between selected and unselected class sets
            var unselArr = tagUnselectedCls[color].split(/\s+/);
            var selArr = tagSelectedCls[color].split(/\s+/);
            var removeSet = isSel ? unselArr : selArr;
            var addSet = isSel ? selArr : unselArr;
            for (var i = 0; i < removeSet.length; i++) { card.classList.remove(removeSet[i]); }
            for (var j = 0; j < addSet.length; j++) { card.classList.add(addSet[j]); }
        }
    }

    /**
     * Update sidebar badge counts in-place (no innerHTML rebuild).
     */
    function patchSidebarBadges() {
        var total = 0;
        var order = state.nsfwEnabled ? ALL_ORDER : SAFE_ORDER;
        for (var i = 0; i < order.length; i++) {
            var cat = order[i];
            var count = state.selectedGroups[cat] ? state.selectedGroups[cat].size : 0;
            total += count;
            var item = document.querySelector('[data-sidebar-cat="' + cat + '"]');
            if (!item) continue;
            var badge = item.querySelector('.sidebar-badge-v10');
            if (count > 0) {
                if (badge) {
                    badge.textContent = count;
                } else {
                    badge = document.createElement('span');
                    badge.className = 'sidebar-badge-v10 text-[11px] text-zinc-500 bg-white/5 px-1.5 py-0.5 rounded-full min-w-[20px] text-center';
                    badge.textContent = count;
                    item.appendChild(badge);
                }
            } else {
                if (badge) badge.remove();
            }
        }
        dom.sidebarTotalBadge.textContent = total + ' 组已选';
    }

    /**
     * Lightweight refresh: updates right panel, prompt, sidebar badges, and
     * persistence — without touching the main content or sidebar structure.
     */
    function lightRefresh() {
        renderSelectedGroups();
        renderPrompt(state.shuffled);
        patchSidebarBadges();
        saveState();
    }

    // ==================== Full Refresh (for structural changes) ====================
    /**
     * Full DOM rebuild. Use only for: initial load, NSFW toggle, language switch,
     * search clearing, and sidebar-category navigation.
     */
    function refreshUI() {
        renderSidebar();
        renderMainContent();
        renderSelectedGroups();
        renderPrompt(state.shuffled);
        updateStaticTexts();
        updateModeUI();
        updateLangButtons();
        updateNsfwButton();
        applySettings();
        var currentSearch = dom.searchInput.value.trim();
        if (currentSearch) performSearch(currentSearch);
        saveState();
    }

    function updateStaticTexts() {
        dom.promptOutput.placeholder = t('hint_emptyPrompt');
        dom.emptyHintRight.textContent = t('hint_emptyRight');
        dom.searchInput.placeholder = t('search_placeholder');
        dom.settingsTitle.textContent = t('settings_title');
        dom.settingsBlurLabel.textContent = t('settings_blur');
        dom.settingsShimmerLabel.textContent = t('settings_shimmer');
        dom.settingsShimmerHint.textContent = t('settings_shimmerHint');
        var labelIds = ['label_selectedGroups','label_prompt','label_clearAll','label_copy','label_shuffle','label_nsfw'];
        for (var i = 0; i < labelIds.length; i++) { var el = document.getElementById(labelIds[i]); if(el) el.textContent = t(labelIds[i]); }
        updateNsfwButton();
    }

    function updateModeUI() {
        var sdBtn = document.querySelector('.mode-option[data-mode="sd"]'), animaBtn = document.querySelector('.mode-option[data-mode="anima"]');
        if (state.mode === 'sd') {
            if(sdBtn){sdBtn.classList.add('bg-indigo-500','text-white');sdBtn.classList.remove('text-zinc-400');}
            if(animaBtn){animaBtn.classList.remove('bg-indigo-500','text-white');animaBtn.classList.add('text-zinc-400');}
        } else {
            if(sdBtn){sdBtn.classList.remove('bg-indigo-500','text-white');sdBtn.classList.add('text-zinc-400');}
            if(animaBtn){animaBtn.classList.add('bg-indigo-500','text-white');animaBtn.classList.remove('text-zinc-400');}
        }
    }

    function updateLangButtons() {
        var btns = $$('.lang-btn');
        btns.forEach(function(btn) {
            if (btn.dataset.lang === state.lang) { btn.classList.add('bg-indigo-500','text-white'); btn.classList.remove('text-zinc-400'); }
            else { btn.classList.remove('bg-indigo-500','text-white'); btn.classList.add('text-zinc-400'); }
        });
    }

    // ==================== NSFW ====================
    function updateNsfwButton() {
        var btn = dom.nsfwBtn, label = $('#label_nsfw');
        if (state.nsfwEnabled) {
            btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold transition-all duration-200 glass border-red-500/30 bg-red-500/10 text-red-300 hover:bg-red-500/20';
            if(label) label.textContent = t('label_nsfwOn');
        } else {
            btn.className = 'px-3 py-2 rounded-xl text-xs font-semibold transition-all duration-200 glass text-zinc-400 hover:text-zinc-200 border-white/5';
            if(label) label.textContent = t('label_nsfw');
        }
    }

    function openNsfwModal() {
        dom.nsfwModalTitle.textContent = '🔞 ' + t('nsfw_modal_title');
        $('#nsfwClause1').textContent = t('nsfw_clause1'); $('#nsfwClause2').textContent = t('nsfw_clause2');
        $('#nsfwClause3').textContent = t('nsfw_clause3'); $('#nsfwClause4').textContent = t('nsfw_clause4');
        $('#nsfwClause5').textContent = t('nsfw_clause5');
        dom.nsfwModalCancel.textContent = t('nsfw_modal_cancel'); dom.nsfwModalConfirm.textContent = t('nsfw_modal_confirm');
        dom.nsfwModal.classList.remove('opacity-0','invisible');
    }

    function closeNsfwModal() { dom.nsfwModal.classList.add('opacity-0','invisible'); }

    function confirmNsfw() { state.nsfwEnabled = true; closeNsfwModal(); refreshUI(); }

    function handleNsfwToggle() {
    if (state.nsfwEnabled) {
        // ========== 关键修复：关闭 NSFW 前清除所有 NSFW 分组的选中项 ==========
        const nsfwCategories = ['nsfwCharacter', 'nsfwClothing', 'nsfwExpression', 'nsfwActionTag', 'nsfwSpecial', 'nsfwActionNatural'];
        for (let cat of nsfwCategories) {
            if (state.selectedGroups[cat]) {
                state.selectedGroups[cat].clear();
            }
        }
        // =================================================================
        state.nsfwEnabled = false;
        refreshUI();
    } else {
        openNsfwModal();
    }
}

    // ==================== Interaction Logic (with targeted updates) ====================
    function toggleGroup(cat, id) {
        var s = state.selectedGroups[cat]; if (!s) return;
        var deselectedIds = []; // {cat, id} pairs for cards that need unselect patching

        if (s.has(id)) {
            s.delete(id);
        } else {
            // Mutual exclusion: actionTag ↔ actionNatural
            if (cat === 'actionTag' && state.selectedGroups.actionNatural.size > 0) {
                var cleared = Array.from(state.selectedGroups.actionNatural);
                for (var i = 0; i < cleared.length; i++) { deselectedIds.push({cat:'actionNatural', id:cleared[i]}); }
                state.selectedGroups.actionNatural.clear();
            } else if (cat === 'actionNatural' && state.selectedGroups.actionTag.size > 0) {
                var cleared2 = Array.from(state.selectedGroups.actionTag);
                for (var j = 0; j < cleared2.length; j++) { deselectedIds.push({cat:'actionTag', id:cleared2[j]}); }
                state.selectedGroups.actionTag.clear();
            }
            // Mutual exclusion: nsfwActionTag ↔ nsfwActionNatural
            if (cat === 'nsfwActionTag' && state.selectedGroups.nsfwActionNatural && state.selectedGroups.nsfwActionNatural.size > 0) {
                var cleared3 = Array.from(state.selectedGroups.nsfwActionNatural);
                for (var k = 0; k < cleared3.length; k++) { deselectedIds.push({cat:'nsfwActionNatural', id:cleared3[k]}); }
                state.selectedGroups.nsfwActionNatural.clear();
            } else if (cat === 'nsfwActionNatural' && state.selectedGroups.nsfwActionTag && state.selectedGroups.nsfwActionTag.size > 0) {
                var cleared4 = Array.from(state.selectedGroups.nsfwActionTag);
                for (var m = 0; m < cleared4.length; m++) { deselectedIds.push({cat:'nsfwActionTag', id:cleared4[m]}); }
                state.selectedGroups.nsfwActionTag.clear();
            }
            s.add(id);
        }
        state.shuffled = false;

        // Targeted DOM updates — no full re-render
        // 1. Update mutually deselected cards (must happen after Set changes)
        for (var n = 0; n < deselectedIds.length; n++) {
            patchCardVisual(deselectedIds[n].cat, deselectedIds[n].id);
        }
        // 2. Update the clicked card
        patchCardVisual(cat, id);
        // 3. Light refresh for right panel, prompt, sidebar badges, persistence
        lightRefresh();
    }

    function removeGroup(cat, id) {
        if (state.selectedGroups[cat]) state.selectedGroups[cat].delete(id);
        state.shuffled = false;
        patchCardVisual(cat, id);
        lightRefresh();
    }

    function clearAll() {
        var total = getTotalGroups();
        if (total === 0) return;
        var allSelected = getAllSelectedGroups(); // capture before clearing
        var cats = Object.keys(state.selectedGroups);
        for (var i = 0; i < cats.length; i++) state.selectedGroups[cats[i]].clear();
        state.shuffled = false;
        // Update all previously selected cards to unselected state
        for (var j = 0; j < allSelected.length; j++) {
            patchCardVisual(allSelected[j].category, allSelected[j].id);
        }
        // Force clear the prompt output and reset custom edit flag
        lastAutoPrompt = '';
        promptIsCustom = false;
        dom.promptOutput.value = '';
        dom.charCount.textContent = '0 ' + t('badge_chars');
        lightRefresh();
    }

    async function handleCopy() {
        var prompt = dom.promptOutput.value; if (!prompt) return;
        try { await copyToClipboard(prompt); dom.copyBtn.classList.add('copy-pulse-v10'); setTimeout(function(){dom.copyBtn.classList.remove('copy-pulse-v10');},700); } catch(e) {}
    }

    function handleShuffle() { if (getTotalGroups() === 0) return; state.shuffled = true; renderPrompt(true, true); }

    function toggleMode(mode) { if (state.mode === mode) return; state.mode = mode; renderPrompt(state.shuffled, true); updateModeUI(); saveState(); }

    function switchLang(lang) { if (state.lang === lang) return; state.lang = lang; document.documentElement.lang = lang==='zh-TW'?'zh-TW':lang==='en'?'en':'zh-CN'; refreshUI(); }

    // ==================== Scroll Spy for Sidebar ====================
    var scrollSpyTimeout;
    dom.mainContent.addEventListener('scroll', function() {
        if (scrollSpyTimeout) clearTimeout(scrollSpyTimeout);
        scrollSpyTimeout = setTimeout(function() {
            var order = state.nsfwEnabled ? ALL_ORDER : SAFE_ORDER;
            var scrollTop = dom.mainContent.scrollTop + 120;
            var currentCat = order[0];
            for (var i = 0; i < order.length; i++) {
                var section = document.querySelector('[data-cat-section="' + order[i] + '"]');
                if (section && section.offsetTop <= scrollTop) currentCat = order[i];
            }
            if (state.activeCategory !== currentCat) {
                state.activeCategory = currentCat;
                renderSidebar();
                saveState();
            }
        }, 100);
    });

    // ==================== Event Binding ====================
    function bindGlobalEvents() {
        // Selected chips container - remove buttons (event delegation, survives innerHTML changes)
        dom.selectedGroupsContainer.addEventListener('click', function(e) {
            var btn = e.target.closest('.remove-chip-btn-v10');
            if (!btn) return; e.stopPropagation();
            var cat = btn.dataset.cat, id = parseInt(btn.dataset.id, 10);
            if (cat && id) removeGroup(cat, id);
        });

        // Selected chips: hover shows a preview card with the example image + notes
        dom.selectedGroupsContainer.addEventListener('mouseover', function(e) {
            var chip = e.target.closest && e.target.closest('[data-chip-cat]');
            if (!chip) return;
            if (chipPreviewHideTimer) { clearTimeout(chipPreviewHideTimer); chipPreviewHideTimer = null; }
            if (chipPreviewShowTimer) clearTimeout(chipPreviewShowTimer);
            chipPreviewShowTimer = setTimeout(function() {
                if (!chip.isConnected) return;
                // Only show if the pointer is still on the chip. Some environments do not
                // implement :hover matching, in which case we keep the preview.
                try { if (chip.matches && !chip.matches(':hover')) return; } catch (err) { /* ignore */ }
                showChipPreview(chip);
            }, 130);
        });
        dom.selectedGroupsContainer.addEventListener('mouseout', function(e) {
            var chip = e.target.closest && e.target.closest('[data-chip-cat]');
            if (!chip) return;
            if (e.relatedTarget && chip.contains(e.relatedTarget)) return;  // still inside the chip
            if (chipPreviewShowTimer) { clearTimeout(chipPreviewShowTimer); chipPreviewShowTimer = null; }
            scheduleChipPreviewHide();
        });

        // Hide the preview as soon as anything scrolls (the chip moves out from under it)
        var chipsScroll = document.getElementById('selectedGroupsScroll');
        if (chipsScroll) chipsScroll.addEventListener('scroll', hideChipPreview);
        dom.mainContent.addEventListener('scroll', hideChipPreview);
        window.addEventListener('scroll', hideChipPreview, true);

        // Tag library: click a 子类 heading to collapse / expand just that block
        dom.contentSections.addEventListener('click', function(e) {
            var head = e.target.closest && e.target.closest('[data-seg-toggle]');
            if (!head) return;
            var seg = head.closest('.lib-seg');
            if (seg && seg.dataset.segKey) toggleLibSeg(seg.dataset.segKey);
        });

        dom.clearAllBtn.addEventListener('click', function(e) { e.stopPropagation(); clearAll(); });
        dom.copyBtn.addEventListener('click', handleCopy);
        dom.shuffleBtn.addEventListener('click', handleShuffle);

        dom.modeToggle.addEventListener('click', function(e) {
            var opt = e.target.closest('.mode-option'); if (!opt) return; toggleMode(opt.dataset.mode);
        });

        var langBtns = $$('.lang-btn');
        langBtns.forEach(function(btn) { btn.addEventListener('click', function() { switchLang(this.dataset.lang); }); });

        dom.nsfwBtn.addEventListener('click', handleNsfwToggle);
        dom.nsfwModalCancel.addEventListener('click', closeNsfwModal);
        dom.nsfwModalConfirm.addEventListener('click', confirmNsfw);
        dom.nsfwModal.addEventListener('click', function(e) { if (e.target === dom.nsfwModal) closeNsfwModal(); });

        // Settings
        dom.settingsBtn.addEventListener('click', openSettings);
        dom.settingsCloseBtn.addEventListener('click', closeSettings);
        dom.settingsBackdrop.addEventListener('click', closeSettings);

        dom.blurSlider.addEventListener('input', function() {
            state.blurIntensity = parseInt(this.value, 10);
            applyBlurIntensity(); saveState();
        });

        dom.shimmerToggle.addEventListener('click', function() {
            state.shimmerEnabled = !state.shimmerEnabled;
            applyShimmer(); saveState();
        });

        // Search
        dom.searchInput.addEventListener('input', handleSearchInput);
        dom.searchClearBtn.addEventListener('click', clearSearch);

        // ========== Prompt textarea: allow direct editing + protect from auto-overwrite ==========
        // Live char count + detect manual customization (guard in renderPrompt)
        dom.promptOutput.addEventListener('input', function() {
            dom.charCount.textContent = this.value.length + ' ' + t('badge_chars');
            promptIsCustom = (this.value !== lastAutoPrompt);
            updateRegenBtn();
        });

        // Explicit "refresh from selections" button — forces overwrite even if customized
        if (dom.regenPromptBtn) {
            dom.regenPromptBtn.addEventListener('click', function() {
                renderPrompt(state.shuffled, true);
            });
        }
    }

    // ==================== Init ====================
    function init() {
        loadState();
        document.documentElement.lang = state.lang === 'zh-TW' ? 'zh-TW' : state.lang === 'en' ? 'en' : 'zh-CN';
        renderSidebar();
        renderMainContent();
        renderSelectedGroups();
        renderPrompt(state.shuffled);
        updateStaticTexts();
        updateModeUI();
        updateLangButtons();
        updateNsfwButton();
        applySettings();
        dom.searchInput.placeholder = t('search_placeholder');
        bindGlobalEvents();

        if (getTotalGroups() === 0) {
            dom.emptyHintRight.classList.remove('hidden'); dom.clearAllBtn.classList.add('hidden');
        }
    }

    init();
})();
</script>
</body>
</html>
